<!doctype html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 12px; background: #ffffff; color: #1f2937;
         display: flex; flex-direction: column; border-left: 1px solid #d5d9e0; }
  #toolbar { display: flex; align-items: center; height: 30px; border-bottom: 1px solid #e5e7eb; background: #f7f8fa; padding: 0 4px; flex-shrink: 0; }
  .tabbtn { padding: 0 10px; height: 30px; line-height: 30px; color: #4b5563; }
  .tabbtn:hover { background: #eceff3; }
  .tabbtn.sel { color: #1d4ed8; box-shadow: inset 0 -2px 0 #1d4ed8; }
  .tool { width: 26px; height: 24px; line-height: 24px; text-align: center; border-radius: 4px; font-size: 14px; color: #4b5563; margin-right: 4px; }
  .tool:hover { background: #e5e7eb; }
  .tool.on { background: #dbeafe; color: #1d4ed8; }
  .spacer { flex: 1; }
  .panel { flex: 1; display: none; overflow: hidden; }
  .panel.sel { display: flex; }
  /* elements */
  #elements { flex-direction: column; }
  #tree { flex: 1; overflow: auto; padding: 4px 0; font-family: Menlo, Consolas, monospace; font-size: 12px; line-height: 18px; }
  .row { white-space: nowrap; padding-right: 8px; }
  .row:hover { background: #eef2ff; }
  .row.sel { background: #dbeafe; }
  .tw { display: inline-block; width: 14px; color: #6b7280; text-align: center; }
  .tag { color: #881280; }
  .an { color: #994500; }
  .av { color: #1a1aa6; }
  .txt { color: #374151; }
  .cmt { color: #236e25; }
  #side { height: 45%; border-top: 1px solid #e5e7eb; overflow: auto; padding: 8px 10px; flex-shrink: 0; }
  .h { font-weight: bold; color: #6b7280; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; margin: 10px 0 6px; }
  .rule { font-family: Menlo, Consolas, monospace; margin-bottom: 8px; }
  .sel-t { color: #1f2937; }
  .src { color: #9ca3af; float: right; font-family: sans-serif; }
  .decl { padding-left: 14px; }
  .pn { color: #c80000; }
  .pv { color: #1f2937; }
  .over { text-decoration: line-through; color: #9ca3af; }
  .bm { margin: 6px auto 10px; text-align: center; font-size: 10px; width: 240px; }
  .bm .m { background: #f9cc9d; padding: 4px 10px; border: 1px dashed #333; }
  .bm .b { background: #fddd9b; padding: 4px 10px; border: 1px solid #000; }
  .bm .p { background: #c3d08b; padding: 4px 10px; border: 1px dashed #555; }
  .bm .c { background: #8cb6c0; padding: 6px; border: 1px solid #555; }
  .cs { display: flex; font-family: Menlo, Consolas, monospace; font-size: 11px; padding: 1px 0; }
  .cs .k { color: #c80000; width: 120px; flex-shrink: 0; }
  /* console */
  #console { flex-direction: column; }
  #log { flex: 1; overflow: auto; font-family: Menlo, Consolas, monospace; font-size: 12px; }
  .msg { padding: 3px 10px; border-bottom: 1px solid #f3f4f6; white-space: pre-wrap; word-wrap: break-word; }
  .msg.error { background: #fef2f2; color: #b91c1c; border-color: #fee2e2; }
  .msg.warn { background: #fffbeb; color: #92400e; border-color: #fef3c7; }
  .msg.input { color: #2563eb; }
  .msg.result { color: #4b5563; }
  .msg .s { float: right; color: #9ca3af; font-family: sans-serif; font-size: 11px; }
  #prompt { display: flex; align-items: center; border-top: 1px solid #e5e7eb; flex-shrink: 0; }
  #prompt span { color: #2563eb; padding: 0 4px 0 10px; font-weight: bold; }
  #cin { flex: 1; border: none; height: 28px; font-family: Menlo, Consolas, monospace; font-size: 12px; outline: none; }
  /* network */
  #network { flex-direction: column; }
  #net { flex: 1; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th { text-align: left; background: #f7f8fa; color: #4b5563; font-weight: normal; padding: 4px 8px; border-bottom: 1px solid #e5e7eb; }
  td { padding: 3px 8px; border-bottom: 1px solid #f3f4f6; white-space: nowrap; }
  td.u { max-width: 260px; overflow: hidden; }
  tr.bad td { color: #dc2626; }
  #netsum { padding: 4px 8px; color: #6b7280; border-top: 1px solid #e5e7eb; flex-shrink: 0; }
  /* app */
  #app { flex-direction: column; overflow: auto; padding: 8px 10px; }
  .kv { display: flex; font-family: Menlo, Consolas, monospace; padding: 2px 0; border-bottom: 1px solid #f3f4f6; }
  .kv .k { width: 40%; color: #881280; overflow: hidden; }
  .kv .v { flex: 1; overflow: hidden; }
  .empty { color: #9ca3af; padding: 16px; text-align: center; }
</style>
</head>
<body>
  <div id="toolbar">
    <div class="tool" id="pick" data-action="pick" title="Select an element in the page">⌖</div>
    <div class="tabbtn sel" data-action="tab" data-arg="elements" id="t-elements">Elements</div>
    <div class="tabbtn" data-action="tab" data-arg="console" id="t-console">Console</div>
    <div class="tabbtn" data-action="tab" data-arg="network" id="t-network">Network</div>
    <div class="tabbtn" data-action="tab" data-arg="app" id="t-app">Application</div>
    <div class="spacer"></div>
    <div class="tool" data-action="close-devtools" title="Close">✕</div>
  </div>
  <div class="panel sel" id="elements">
    <div id="tree"></div>
    <div id="side"></div>
  </div>
  <div class="panel" id="console">
    <div id="log"></div>
    <div id="prompt"><span>›</span><input id="cin" data-action="eval" autocomplete="off" spellcheck="false" placeholder="Evaluate JavaScript in the page"></div>
  </div>
  <div class="panel" id="network">
    <div id="net"></div>
    <div id="netsum"></div>
  </div>
  <div class="panel" id="app"></div>
</body>
</html>
