<!doctype html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 13px; background: #dfe3ea; color: #1f2937; }
  #tabs { display: flex; align-items: flex-end; height: 36px; padding: 6px 8px 0 78px; gap: 2px; }
  .tab { display: flex; align-items: center; gap: 6px; width: 200px; min-width: 60px; flex-shrink: 1; height: 30px; padding: 0 8px 0 12px;
         border-radius: 9px 9px 0 0; color: #4b5563; cursor: default; overflow: hidden; }
  .tab:hover { background: #eceff4; }
  .tab.active { background: #f7f8fa; color: #111827; box-shadow: 0 -1px 2px rgba(0,0,0,0.05); }
  .tab .title { flex: 1; white-space: nowrap; overflow: hidden; }
  .tab .x { width: 18px; height: 18px; border-radius: 9px; text-align: center; line-height: 18px; color: #6b7280; font-size: 14px; }
  .tab .x:hover { background: #d1d5db; color: #111827; }
  .tab .dot { width: 8px; height: 8px; border-radius: 4px; background: #6366f1; }
  #newtab { width: 28px; height: 28px; margin-bottom: 1px; border-radius: 8px; text-align: center; line-height: 28px; font-size: 18px; color: #4b5563; flex: none; }
  #newtab:hover { background: #cfd5df; }
  .tab { flex: none; }
  .scroll { width: 22px; height: 28px; margin-bottom: 1px; border-radius: 6px; text-align: center; line-height: 28px; font-size: 16px; color: #4b5563; flex: none; }
  .scroll:hover { background: #cfd5df; }
  .scroll.off { color: #b8bec8; }
  .scroll.off:hover { background: transparent; }
  .more { margin-left: 2px; padding: 0 5px; border-radius: 8px; background: #cfd5df; font-size: 11px; color: #374151; height: 18px; line-height: 18px; margin-bottom: 6px; flex: none; }
  #spacer { flex: 1; align-self: stretch; }
  #alltabs { width: 28px; height: 28px; margin-bottom: 1px; border-radius: 8px; text-align: center; line-height: 26px; font-size: 15px; color: #4b5563; flex: none; }
  #alltabs:hover, #alltabs.on { background: #cfd5df; }
  #bar { display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px; background: #f7f8fa; border-bottom: 1px solid #d5d9e0; }
  .btn { width: 30px; height: 30px; border-radius: 8px; text-align: center; line-height: 30px; font-size: 17px; color: #374151; }
  .btn:hover { background: #e5e7eb; }
  .btn.off { color: #c4c8cf; }
  .btn.off:hover { background: transparent; }
  .btn.on { background: #e0e7ff; color: #4338ca; }
  #addr { flex: 1; height: 30px; margin: 0 6px; padding: 0 14px; border-radius: 15px; border: 1px solid #d1d5db; background: #eef0f4;
          font-size: 14px; color: #111827; }
  #addr:focus { background: white; outline: 2px solid #818cf8; border-color: transparent; }
  #lock { font-size: 12px; color: #059669; margin-left: 4px; }
  #progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: #6366f1; }
  #progress.loading { width: 60%; }
</style>
</head>
<body>
  <div id="tabs"></div>
  <div id="bar">
    <div class="btn" id="back" data-action="back" title="Back">←</div>
    <div class="btn" id="fwd" data-action="forward" title="Forward">→</div>
    <div class="btn" id="reload" data-action="reload" title="Reload">↻</div>
    <div class="btn" id="home" data-action="home" title="Home">⌂</div>
    <span id="lock"></span>
    <input id="addr" data-action="go" autocomplete="off" spellcheck="false" placeholder="Search or enter address">
    <div class="btn" id="devtools" data-action="devtools" title="Developer tools (F12)">⚙</div>
  </div>
  <div id="progress"></div>
</body>
</html>
