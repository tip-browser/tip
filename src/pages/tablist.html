<!doctype html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 13px; background: #ffffff; color: #1f2937; border: 1px solid #d1d5db; }
  #q { display: block; width: calc(100% - 16px); margin: 8px; height: 30px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; background: #f7f8fa; }
  #q:focus { outline: 2px solid #818cf8; border-color: transparent; background: white; }
  #count { padding: 2px 16px 6px; color: #6b7280; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #list { overflow-y: auto; height: calc(100% - 72px); padding: 0 6px 6px; }
  .row { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 10px; border-radius: 7px; }
  .row:hover { background: #f1f3f7; }
  .row.active { background: #e0e7ff; }
  .row .text { flex: 1; min-width: 0; overflow: hidden; }
  .row .t { display: block; white-space: nowrap; overflow: hidden; color: #111827; }
  .row .u { display: block; white-space: nowrap; overflow: hidden; color: #6b7280; font-size: 11px; }
  .row .dot { width: 8px; height: 8px; border-radius: 4px; background: #6366f1; flex: none; }
  .row .x { width: 22px; height: 22px; border-radius: 11px; text-align: center; line-height: 22px; color: #6b7280; font-size: 15px; flex: none; }
  .row .x:hover { background: #d1d5db; color: #111827; }
  .empty { padding: 16px; color: #6b7280; text-align: center; }
</style>
</head>
<body>
  <input id="q" placeholder="Search tabs" autocomplete="off" spellcheck="false" data-action="pick">
  <div id="count"></div>
  <div id="list"></div>
</body>
</html>
