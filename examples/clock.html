<!doctype html>
<html><head><meta charset="utf-8"><title>Clock</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column;
         background: radial-gradient(circle, #1e293b, #020617); color: #e2e8f0; font-family: Arial, sans-serif; }
  #time { font-size: 96px; font-weight: bold; letter-spacing: 2px; color: white; }
  #date { font-size: 22px; color: #94a3b8; margin-top: 6px; }
  .bar { width: 420px; height: 8px; background: #1e293b; border-radius: 4px; margin-top: 28px; overflow: hidden; }
  #sec { height: 8px; width: 0; background: linear-gradient(90deg, #22d3ee, #a78bfa); border-radius: 4px; }
  #log { margin-top: 26px; color: #64748b; font-size: 14px; height: 60px; }
  .pulse { color: #22d3ee; }
</style></head>
<body>
  <div id="time">--:--:--</div>
  <div id="date"></div>
  <div class="bar"><div id="sec"></div></div>
  <div id="log"></div>
<script>
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pad = n => String(n).padStart(2, '0');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function render() {
    const d = new Date();
    $('time').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    $('date').textContent = `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    $('sec').style.width = `${(d.getSeconds() + d.getMilliseconds() / 1000) / 60 * 100}%`;
  }

  (async () => {
    // async/await drives this loop without blocking the browser UI.
    while (true) {
      render();
      await sleep(100);
    }
  })();

  (async () => {
    let count = 0;
    for (;;) {
      await sleep(1000);
      count++;
      $('log').innerHTML = `async loop running for <span class="pulse">${count}s</span>`;
    }
  })();
</script>
</body></html>
